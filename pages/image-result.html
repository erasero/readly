<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 변환 결과 | Readly</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/image-result.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="../index.html">
      <span class="logo-mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.2"/></svg></span>
      Readly
    </a>
    <a class="help-link" href="#">도움말</a>
  </header>

  <main class="image-result">
    <section class="page-heading">
      <a class="back-link" href="color-upload.html">← 업로드로 돌아가기</a>
      <div class="page-title-row">
        <span class="feature-icon feature-icon--color">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M3.5 18l5-5 4 4 3-3 5 5"/></svg>
        </span>
        <h1 class="page-title">이미지 변환 결과</h1>
        <div class="page-actions">
          <a class="btn btn--gray" href="color-upload.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9M7 13l5-5 5 5M5 4h14"/></svg>다른 파일 올리기</a>
          <button class="btn btn--primary" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>다운로드</button>
        </div>
      </div>
    </section>

    <p class="applied-type">
      <span class="applied-type__label">적용된 유형</span>
      <span class="applied-type__value">적색 계열 (Protan)</span>
      <span class="applied-type__note">유형 변경은 업로드 화면에서 할 수 있어요.</span>
    </p>

    <div class="compare">
      <figure class="compare__item">
        <figcaption class="compare__label">원본</figcaption>
        <div class="card compare__frame">
          <div class="preview"><svg class="preview__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM8.5 7.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3M4.5 18l5-5 4 4 3-3 4 4"/></svg><span>원본 이미지</span></div>
        </div>
      </figure>
      <figure class="compare__item">
        <figcaption class="compare__label">변환 결과</figcaption>
        <div class="card compare__frame">
          <div class="preview"><svg class="preview__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM8.5 7.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3M4.5 18l5-5 4 4 3-3 4 4"/></svg><span>변환된 이미지</span></div>
        </div>
      </figure>
    </div>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>
