<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>색상 변환 | Readly</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/color-upload.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="../index.html">
      <span class="logo-mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.2"/></svg></span>
      Readly
    </a>
    <a class="help-link" href="#">도움말</a>
  </header>

  <main class="color-upload">
    <section class="page-heading">
      <a class="back-link" href="../index.html">← 홈으로</a>
      <div class="page-title-row">
        <span class="feature-icon feature-icon--color">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M3.5 18l5-5 4 4 3-3 5 5"/></svg>
        </span>
        <h1 class="page-title">색상 변환</h1>
      </div>
      <p class="page-desc">이미지나 동영상을 올리고 내 색각 유형을 선택하세요.</p>
    </section>

    <form class="upload-layout" action="image-result.html">
      <section class="card upload-card" aria-label="파일 업로드">
        <label class="dropzone">
          <input class="sr-only" type="file" name="media" accept="image/jpeg,image/png,video/mp4">
          <svg class="dropzone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9M7 13l5-5 5 5M5 4h14"/></svg>
          <span class="dropzone__title">이미지나 동영상을 끌어다 놓거나 클릭하세요</span>
          <span class="dropzone__hint">JPG · PNG · MP4</span>
          <span class="btn btn--outline-blue"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5"/></svg>파일 선택</span>
        </label>

        <div class="selected-file">
          <span class="feature-icon feature-icon--color selected-file__icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M10 8.5l5 3.5-5 3.5z" fill="currentColor"/></svg></span>
          <div class="selected-file__info">
            <p class="selected-file__name">class_chart.mp4</p>
            <p class="selected-file__meta">동영상 · 12.4MB</p>
          </div>
          <button class="selected-file__remove" type="button">삭제</button>
        </div>
      </section>

      <section class="card option-card" aria-labelledby="type-title">
        <h2 class="option-card__title" id="type-title">색각 유형 선택</h2>
        <div class="radio-group" role="radiogroup" aria-labelledby="type-title">
          <label class="radio"><input type="radio" name="type" value="protan" checked> 적색 계열 (Protan)</label>
          <label class="radio"><input type="radio" name="type" value="deutan"> 녹색 계열 (Deutan)</label>
          <label class="radio"><input type="radio" name="type" value="tritan"> 청색 계열 (Tritan)</label>
        </div>
        <p class="option-card__note">유형은 이 화면에서만 고를 수 있어요. 바꾸려면 결과 화면에서 돌아와 다시 선택하세요.</p>
        <button class="btn btn--primary option-card__submit" type="submit"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>변환하기</button>
      </section>
    </form>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>
