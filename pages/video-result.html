<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동영상 변환 결과 | Readly</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/video-result.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="../index.html">
      <span class="logo-mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.2"/></svg></span>
      Readly
    </a>
    <a class="help-link" href="#">도움말</a>
  </header>

  <main class="video-result">
    <section class="page-heading">
      <a class="back-link" href="color-upload.html">← 업로드로 돌아가기</a>
      <div class="page-title-row">
        <span class="feature-icon feature-icon--color">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M10 8.5l5 3.5-5 3.5z" fill="currentColor"/></svg>
        </span>
        <h1 class="page-title">동영상 변환 결과</h1>
        <div class="page-actions">
          <a class="btn btn--gray" href="color-upload.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9M7 13l5-5 5 5M5 4h14"/></svg>다른 파일 올리기</a>
          <button class="btn btn--primary" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>다운로드</button>
        </div>
      </div>
    </section>

    <p class="applied-type">
      <span class="applied-type__label">적용된 유형</span>
      <span class="applied-type__value">적색 계열 (Protan)</span>
      <span class="applied-type__note">유형 변경은 업로드 화면에서 할 수 있어요.</span>
    </p>

    <section class="player" aria-label="동영상 플레이어">
      <div class="player__screen">
        <span class="player__badge">변환 결과 보는 중</span>
        <div class="player__toggle" role="group" aria-label="보기 전환">
          <button type="button" aria-pressed="false">원본</button>
          <button type="button" aria-pressed="true">변환</button>
        </div>
        <button class="player__big-play" type="button" aria-label="재생">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z" fill="currentColor"/></svg>
        </button>
      </div>

      <div class="card player__controls">
        <button class="player__play" type="button" aria-label="재생">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z" fill="currentColor"/></svg>
        </button>
        <span class="player__time">00:12 / 01:30</span>
        <input class="range player__progress" type="range" min="0" max="90" value="12" aria-label="재생 위치">
        <button class="player__fullscreen" type="button">전체 화면</button>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>
