<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Readly</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">
      <span class="logo-mark" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.2"/></svg></span>
      Readly
    </a>
    <a class="help-link" href="#">도움말</a>
  </header>

  <main class="home">
    <section class="hero">
      <h1 class="hero__title">무엇을 도와드릴까요?</h1>
      <p class="hero__desc">카드를 눌러 기능을 선택하세요.</p>
    </section>

    <ul class="feature-list">
      <li>
        <a class="feature-card card" href="pages/color-upload.html">
          <span class="feature-icon feature-icon--color feature-icon--large">
            <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M3.5 18l5-5 4 4 3-3 5 5"/></svg>
          </span>
          <span class="tag tag--color">색각이상</span>
          <h2 class="feature-card__title">색상 변환</h2>
          <p class="feature-card__desc">색각 유형에 맞게 이미지와 동영상의 색을 바꿔 드려요.</p>
        </a>
      </li>
      <li>
        <a class="feature-card card" href="pages/text-upload.html">
          <span class="feature-icon feature-icon--text feature-icon--large">
            <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h12M4 18h16"/></svg>
          </span>
          <span class="tag tag--text">난독증</span>
          <h2 class="feature-card__title">텍스트 변환</h2>
          <p class="feature-card__desc">글꼴과 간격을 바꾸고 소리로 읽어 드려요.</p>
        </a>
      </li>
      <li>
        <a class="feature-card card" href="pages/writing.html">
          <span class="feature-icon feature-icon--writing feature-icon--large">
            <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19l1-4 10-10 3 3-10 10z"/><path d="M14 7l3 3"/><path d="M12 20h7"/></svg>
          </span>
          <span class="tag tag--writing">난독증</span>
          <h2 class="feature-card__title">글쓰기 가이드</h2>
          <p class="feature-card__desc">직접 쓴 글의 맞춤법과 띄어쓰기를 교정해 드려요.</p>
        </a>
      </li>
    </ul>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>
